    <div    class="lrp-card lrp-col-span-2"

            Current Year ADA/ADM (Average Attendance)

        </h2>
        <div class="lrp-thermo-legend">
            <span   data-ng-if="currentBand"
                    class="att-band-pill"
                    ng-style="{'--band-color': currentBand.colorcode, 'color': bandTextColor(currentBand.colorcode)}"

                    aria-label="{{currentBand.label}}">
                {{currentBand.label}}
            </span>
            <span data-ng-if="thermoValue != null">
                <strong>{{thermoValue}}%</strong> attendance so far for this year
            </span>
            <span data-ng-if="cur_year_graph.adaadm_ratio != null" class="lrp-thermo-sub">
                (ratio {{cur_year_graph.adaadm_ratio | number:3}})
            </span>
            
        </div>
        <!-- Thermometer directive we built earlier -->
        <lrp-thermometer-bar
            bands="attBands"
            value="thermoValue"
            default-color="#e5e7eb"
            height="16"
            show-labels="true">
        </lrp-thermometer-bar>

<style>
